[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "wattshift"
version = "1.0.0rc4"
description = "Auditable electricity-aware compute scheduling"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.5,<2", "lightgbm>=4.6,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "prometheus-client>=0.21,<1", "PyYAML>=6,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "matplotlib>=3.9,<4", "Pillow>=11,<13"]
[tool.setuptools.packages.find]
include = ["wattshift*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
