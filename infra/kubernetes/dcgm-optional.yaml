# Optional: only on a real NVIDIA GPU cluster with drivers and device plugin installed.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wattshift-dcgm
  namespace: wattshift
spec:
  selector:
    matchLabels: {app: wattshift-dcgm}
  template:
    metadata:
      labels: {app: wattshift-dcgm}
    spec:
      nodeSelector: {nvidia.com/gpu.present: 'true'}
      containers:
        - name: exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.1-4.8.0-distroless
          ports: [{name: metrics, containerPort: 9400}]
          securityContext:
            capabilities: {add: [SYS_ADMIN]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: wattshift-dcgm
  namespace: wattshift
spec:
  selector: {app: wattshift-dcgm}
  ports: [{name: metrics, port: 9400}]
