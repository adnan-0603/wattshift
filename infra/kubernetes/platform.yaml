  verbs:
  - get
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - admissionchecks/status
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wattshift-admissioncheck-status
subjects:
- kind: ServiceAccount
  name: wattshift-controller
  namespace: wattshift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wattshift-admissioncheck-status
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wattshift-controller
  namespace: wattshift
  labels:
    app.kubernetes.io/part-of: wattshift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wattshift-controller
  template:
    metadata:
      labels:
        app: wattshift-controller
        app.kubernetes.io/part-of: wattshift
    spec:
      containers:
      - name: wattshift-controller
        image: wattshift/backend:1.0.0-rc4
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 1Gi
        command:
        - python
        - -m
        - wattshift.controller
        env:
        - name: WATTSHIFT_DATA
          value: /data
        - name: WATTSHIFT_ALLOW_STALE_DEMO
          value: '1'
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
