          claimName: wattshift-data
      serviceAccountName: wattshift-controller
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wattshift-ingress
  namespace: wattshift
  labels:
    app.kubernetes.io/part-of: wattshift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wattshift-ingress
rules:
- apiGroups:
  - ''
  resources:
  - services
  - endpoints
  - secrets
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - ingressclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses/status
  verbs:
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wattshift-ingress
subjects:
- kind: ServiceAccount
  name: wattshift-ingress
  namespace: wattshift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wattshift-ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wattshift-ingress
  namespace: wattshift
  labels:
    app.kubernetes.io/part-of: wattshift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wattshift-ingress
  template:
    metadata:
      labels:
        app: wattshift-ingress
        app.kubernetes.io/part-of: wattshift
    spec:
      containers:
      - name: wattshift-ingress
        image: traefik:v3.6.2
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 1Gi
        ports:
        - containerPort: 8000
          hostPort: 80
        args:
        - --providers.kubernetesingress=true
        - --providers.kubernetesingress.ingressclass=wattshift
        - --providers.kubernetesingress.namespaces=wattshift
        - --entrypoints.web.address=:8000
        - --log.level=INFO
      serviceAccountName: wattshift-ingress
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: wattshift
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wattshift-console
  namespace: wattshift
  labels:
    app.kubernetes.io/part-of: wattshift
spec:
  ingressClassName: wattshift
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wattshift-console
            port:
              number: 80
