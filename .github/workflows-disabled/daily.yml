name: Refresh market snapshot
on:
  schedule:
    - cron: '25 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock.txt
      - run: python -m wattshift.refresh
      - run: python -m scripts.badge
      - name: Commit meaningful data changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/console/public/data/console.json docs/assets/today.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh German market snapshot'
            git push
          fi
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/console/package-lock.json}
      - uses: actions/configure-pages@v5
      - run: npm ci && npm run build
        working-directory: apps/console
        env: {VITE_MODE: public, VITE_BASE: './'}
      - uses: actions/upload-pages-artifact@v3
        with: {path: apps/console/dist}
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
