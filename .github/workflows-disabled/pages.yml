name: Publish Console
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/console/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/console/package-lock.json}
      - uses: actions/configure-pages@v5
      - run: npm ci && npm test && npm run test:ui && npm run build
        working-directory: apps/console
        env: {VITE_MODE: public, VITE_BASE: './'}
      - uses: actions/upload-pages-artifact@v3
        with: {path: apps/console/dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
